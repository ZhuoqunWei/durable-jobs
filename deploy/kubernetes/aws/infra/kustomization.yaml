apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: durable-jobs-aws
resources:
  - ../../base/infra
  - namespace.yaml
  - storage.yaml
  - service-account.yaml
configMapGenerator:
  - name: database-config
    literals:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=durable_jobs
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
  - name: database-client-config
    literals:
      # pgx reads the password separately from PGPASSWORD. No URL escaping needed.
      - DATABASE_URL=postgres://jobs_owner@postgres.durable-jobs-aws.svc.cluster.local:5432/durable_jobs?sslmode=verify-full&sslrootcert=/etc/database-ca/ca.crt
  - name: app-config
    literals:
      - HTTP_ADDR=0.0.0.0:8085
  - name: database-bootstrap
    files:
      - 10-role.sql
      - pg_hba.conf
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: postgres-patch.yaml
