groups:
  - name: lab-reliability
    rules:
      - record: durable_jobs:slo_start_ratio
        expr: (durable_jobs_slo_start_good / durable_jobs_slo_start_eligible) and (durable_jobs_slo_start_eligible > 0)
      - record: durable_jobs:slo_completion_ratio
        expr: (durable_jobs_slo_completion_good / durable_jobs_slo_completion_eligible) and (durable_jobs_slo_completion_eligible > 0)
      - alert: JobQueueGrowing
        expr: durable_jobs_queue_depth > 5 and delta(durable_jobs_queue_depth[1m]) > 0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: Queue is growing; inspect worker heartbeat and database latency
      - alert: JobFailureRateHigh
        expr: sum without(outcome) (increase(durable_jobs_terminal_total{outcome="failed"}[2m])) / clamp_min(sum without(outcome) (increase(durable_jobs_terminal_total[2m])), 1) > 0.05
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: More than 5 percent of recent terminal jobs failed
      - alert: JobMetricsUnavailable
        expr: up{job="durable-jobs"} == 0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: Metrics unavailable; a database outage can also cause this
      - alert: JobCompletionLatencyHigh
        expr: histogram_quantile(0.95, rate(durable_jobs_completion_latency_seconds_bucket[1m])) > 5
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: Recent p95 enqueue-to-terminal latency exceeds 5 seconds
